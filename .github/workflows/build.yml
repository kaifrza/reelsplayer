name: Build APK from ZIP

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'Zip ka naam (khali chhodo = latest zip)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Latest zip dhundo
        id: pick
        env:
          INPUT_ZIP: ${{ github.event.inputs.zip_name }}
        run: |
          latest="$INPUT_ZIP"
          if [ -z "$latest" ]; then
            best=0
            for f in *.zip; do
              [ -f "$f" ] || continue
              t=$(git log -1 --format=%ct -- "$f")
              t=${t:-0}
              if [ "$t" -ge "$best" ]; then best=$t; latest="$f"; fi
            done
          fi
          if [ -z "$latest" ] || [ ! -f "$latest" ]; then
            echo "::error title=Zip nahi mili::Repo ke root me koi .zip file nahi mili"
            exit 1
          fi
          echo "Selected zip: $latest"
          echo "name=$latest" >> "$GITHUB_OUTPUT"
          echo "base=${latest%.zip}" >> "$GITHUB_OUTPUT"

      - name: Zip extract karo
        id: extract
        env:
          ZIP: ${{ steps.pick.outputs.name }}
        run: |
          rm -rf _build && mkdir _build
          if ! unzip -q "$ZIP" -d _build; then
            echo "::error title=Zip extract fail::$ZIP kharab hai ya khul nahi rahi"
            exit 1
          fi
          s=$(find _build -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$s" ]; then
            echo "::error title=Project nahi mila::$ZIP ke andar settings.gradle(.kts) nahi hai"
            exit 1
          fi
          echo "Project folder: $(dirname "$s")"
          echo "dir=$(dirname "$s")" >> "$GITHUB_OUTPUT"

      - name: Error report helper
        run: |
          cat > "$RUNNER_TEMP/report.sh" <<'EOS'
          set +e
          LOG="$1"; TITLE="$2"; LEVEL="$3"
          R="$(mktemp)"
          {
            echo "Zip: $ZIP"
            echo
            echo "--- Compile errors ---"
            grep -E '^e: |error: ' "$LOG" | sed -E 's#file://[^ ]*/(app/src)#\1#' | awk '!seen[$0]++' | head -n 30
            echo
            echo "--- Gradle reason ---"
            grep -m1 -A10 'What went wrong' "$LOG"
            echo
            echo "--- R8 / resources ---"
            grep -E 'R8:|Missing class|AAPT|ERROR:' "$LOG" | awk '!seen[$0]++' | head -n 15
            echo
            echo "--- Last 25 lines ---"
            tail -n 25 "$LOG"
          } > "$R"
          echo "=================== $TITLE: YE COPY KARKE BHEJO ==================="
          cat "$R"
          echo "======================================================================="
          {
            echo "## $TITLE - ye copy karke bhejo"
            echo '```'
            cat "$R"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          MSG=$(head -c 3500 "$R" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::$LEVEL title=$TITLE::$MSG"
          EOS

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7

      - name: Release APK build karo (fast + optimized)
        id: build_release
        continue-on-error: true
        shell: bash
        working-directory: ${{ steps.extract.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build_release.log"
          else
            gradle assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build_release.log"
          fi

      - name: Release fail hua - reason
        if: steps.build_release.outcome == 'failure'
        env:
          ZIP: ${{ steps.pick.outputs.name }}
        run: bash "$RUNNER_TEMP/report.sh" build_release.log "Release build fail (debug se chala raha hoon)" warning

      - name: Debug APK fallback
        id: build_debug
        if: steps.build_release.outcome == 'failure'
        continue-on-error: true
        shell: bash
        working-directory: ${{ steps.extract.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build_debug.log"
          else
            gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build_debug.log"
          fi

      - name: Debug bhi fail - reason
        if: steps.build_debug.outcome == 'failure'
        env:
          ZIP: ${{ steps.pick.outputs.name }}
        run: bash "$RUNNER_TEMP/report.sh" build_debug.log "Build fail" error

      - name: Logs save karo
        if: steps.build_release.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: |
            build_release.log
            build_debug.log

      - name: Job ko fail mark karo
        if: steps.build_debug.outcome == 'failure'
        run: exit 1

      - name: APK collect karo
        id: collect
        env:
          DIR: ${{ steps.extract.outputs.dir }}
          BASE: ${{ steps.pick.outputs.base }}
        run: |
          kind=release
          apk=$(find "$DIR" -path '*outputs/apk/release/*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            kind=debug
            apk=$(find "$DIR" -path '*outputs/apk/debug/*.apk' | head -n 1)
          fi
          if [ -z "$apk" ]; then
            echo "::error title=APK nahi mili::Build chala par APK output me nahi mili"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/$BASE.apk"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pick.outputs.base }}-apk
          path: dist/*.apk

      - name: Release banao
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.pick.outputs.base }}
          KIND: ${{ steps.collect.outputs.kind }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" "dist/$BASE.apk" \
            --target "$GITHUB_SHA" \
            --title "$BASE (build ${{ github.run_number }}, $KIND)" \
            --notes "Built from $BASE.zip ($KIND build)"
          echo "### ✅ APK ready ($KIND build)" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
